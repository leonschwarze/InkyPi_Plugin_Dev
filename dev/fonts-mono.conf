<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NUR ZUM VERGLEICH (render.py --font mono): Schrift ganz ohne Kantenglättung.
     Nicht auf dem Pi verwenden: FreeType rundet jeden Buchstaben einzeln, die
     Strichstärken werden ungleich. Empfohlen ist dev/fonts-eink.conf. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
