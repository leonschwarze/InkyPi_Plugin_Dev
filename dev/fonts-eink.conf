<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Schrift für E-Ink: geglättet, aber mit dem Autohinter von FreeType.
     Der Autohinter setzt alle Striche einer Schriftgröße auf dieselbe Pixelbreite.
     Die grauen Kantenpixel macht anschließend eink.py hart schwarz oder weiß.
     Ergebnis: gleichmäßige Strichstärken ohne graue Ränder.
     (Ganz ohne Kantenglättung, siehe fonts-mono.conf, rundet FreeType jeden Buchstaben
     einzeln; dadurch wirken z. B. „n“ dünn und „H“ fett.)
     Für Tests: FONTCONFIG_FILE=dev/fonts-eink.conf. Auf dem Pi: Inhalt ohne die
     include-Zeile nach /etc/fonts/local.conf (siehe README). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
